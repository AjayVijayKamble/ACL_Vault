name: ACLVault
options:
  bundleIdPrefix: com.aclvault
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  ENABLE_PREVIEWS: YES
targets:
  ACLVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ACLVault
        excludes:
          - "Configuration/Info.plist"
    info:
      path: ACLVault/Configuration/Info.plist
      properties:
        CFBundleDisplayName: "ACL Vault"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: ACLVault
        PRODUCT_BUNDLE_IDENTIFIER: com.aclvault.app
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "ACL Vault uses the camera and Vision AI framework to track Hip, Knee, and Ankle landmarks to compute clinical range of motion without physical tools."
        INFOPLIST_KEY_NSMotionUsageDescription: "ACL Vault uses the device gyroscope and accelerometer to calculate thigh-to-shin delta angles during knee flexion and extension tests."
schemes:
  ACLVault:
    build:
      targets:
        ACLVault: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
